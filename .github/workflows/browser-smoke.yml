name: Browser start smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Launch local game server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/chicken-run-http.log 2>&1 &
          sleep 2
      - name: Verify game starts and time advances
        run: node tests/browser-start-smoke.cjs
      - name: Save screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-screenshot
          path: browser-start-smoke.png
