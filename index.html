<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#79c86e" />
  <meta name="description" content="《小鸡快跑》——保护鸡群，在不断增强的狐狸潮中坚持更久。" />
  <title>小鸡快跑</title>
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/phase4b.css" />
  <link rel="stylesheet" href="./styles/phase4c.css" />
  <link rel="stylesheet" href="./styles/phase4d.css" />
  <link rel="stylesheet" href="./styles/phase4e.css" />
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="小鸡快跑游戏画面"></canvas>

    <section id="hud" class="hud hidden" aria-live="polite">
      <div class="hud-top">
        <div class="hud-left">
          <div class="pill">🐥 <span id="chicksAlive">10</span>/10</div>
          <div class="pill">🦊 <span id="foxesDefeated">0</span></div>
          <div class="pill level-pill">⭐ Lv.<span id="level">1</span></div>
          <div class="pill danger-pill">⚠ <span id="dangerLevel">1</span></div>
          <div class="pill weapon-pill"><span id="weaponIcon">⚔️</span><span id="weaponName">长剑</span></div>
          <div id="cauldronPill" class="pill cauldron-pill hidden">🏺 <span id="cauldronEnergy">0/20</span></div>
        </div>
        <div id="timer" class="timer">00:00</div>
        <div class="hud-actions">
          <button id="buildButton" class="icon-button" type="button" aria-label="查看当前构筑">📖</button>
          <button id="pauseButton" class="icon-button" type="button" aria-label="暂停游戏">Ⅱ</button>
        </div>
      </div>
      <div class="xp-track" aria-label="经验值">
        <div id="xpBar" class="xp-bar"></div>
      </div>
    </section>

    <div id="waveNotice" class="wave-notice hidden" aria-live="assertive">⚠ 狐狸潮来袭</div>

    <section id="startPanel" class="panel start-panel">
      <div class="hero-chick" aria-hidden="true">
        <img class="hero-chick-image" src="./assets/sprites/chick.svg" alt="" />
      </div>
      <h1>小鸡快跑</h1>
      <p class="subtitle">选择武器，保护鸡群，看看你能坚持多久！</p>

      <div class="weapon-select" id="weaponSelect" aria-label="选择初始武器">
        <button class="weapon-card selected" data-weapon="sword" type="button">
          <span class="weapon-card-icon"><img class="weapon-card-image" src="./assets/sprites/sword.svg" alt="" /></span>
          <strong>长剑</strong>
          <small>高频扇形斩击，每第三击追加剑气</small>
        </button>
        <button class="weapon-card" data-weapon="spear" type="button">
          <span class="weapon-card-icon"><img class="weapon-card-image" src="./assets/sprites/spear.svg" alt="" /></span>
          <strong>长枪</strong>
          <small>高速往返穿透，后期可成长为多枪齐发</small>
        </button>
        <button class="weapon-card" data-weapon="hammer" type="button">
          <span class="weapon-card-icon"><img class="weapon-card-image" src="./assets/sprites/hammer.svg" alt="" /></span>
          <strong>大锤</strong>
          <small>抬锤后范围爆发，眩晕并强力击退</small>
        </button>
      </div>

      <div class="instructions">
        <span>电脑：WASD / 方向键移动</span>
        <span>手机：按住画面任意位置生成摇杆</span>
        <span>没有倒计时终点，危险会持续上升</span>
        <span>每次升级可刷新一次技能选项</span>
      </div>
      <button id="startButton" class="primary-button" type="button">开始坚持</button>
      <button id="codexButton" class="secondary-button codex-entry-button" type="button">📖 技能图鉴</button>
      <p id="bestText" class="best-text">最长坚持：尚无纪录</p>
    </section>

    <section id="pausePanel" class="panel hidden">
      <h2>已暂停</h2>
      <div class="pause-build-box">
        <h3>本局构筑</h3>
        <div id="pauseBuildList" class="pause-build-list"></div>
      </div>
      <button id="pauseCodexButton" class="secondary-button" type="button">查看完整构筑与图鉴</button>
      <button id="resumeButton" class="primary-button" type="button">继续游戏</button>
      <button id="restartFromPauseButton" class="secondary-button" type="button">重新开始</button>
    </section>

    <section id="upgradePanel" class="panel upgrade-panel hidden">
      <div class="upgrade-star" aria-hidden="true">⭐</div>
      <h2>升级啦！</h2>
      <p>选择一项强化，本局立即生效</p>
      <div id="upgradeChoices" class="upgrade-choices"></div>
      <div class="upgrade-toolbar">
        <button id="rerollButton" class="reroll-button" type="button">
          🔄 刷新选项（<span id="rerollCount">1/1</span>）
        </button>
      </div>
    </section>

    <section id="buildPanel" class="panel build-panel hidden">
      <div class="build-panel-header">
        <h2>构筑与技能图鉴</h2>
        <button id="closeBuildButton" class="build-close-button" type="button" aria-label="关闭">×</button>
      </div>
      <div id="buildStats" class="build-stats">尚未开始本局</div>
      <section class="build-section">
        <h3>本局已获得</h3>
        <div id="currentBuildList" class="build-skill-grid"></div>
      </section>
      <section class="build-section">
        <h3>已触发组合</h3>
        <div id="comboList" class="build-skill-grid"></div>
      </section>
      <section class="build-section">
        <h3>已见技能（<span id="codexCount">0</span>）</h3>
        <div id="codexList" class="build-skill-grid"></div>
      </section>
    </section>

    <section id="resultPanel" class="panel hidden">
      <div id="resultEmoji" class="result-emoji" aria-hidden="true">🛡️</div>
      <h2 id="resultTitle">本次坚持结束</h2>
      <p id="resultText"></p>
      <p id="resultBest" class="result-best"></p>
      <button id="restartButton" class="primary-button" type="button">再坚持一次</button>
    </section>

    <div id="comboToast" class="combo-toast hidden" aria-live="assertive"></div>

    <div id="joystick" class="joystick hidden" aria-hidden="true">
      <div class="joystick-base">
        <div id="joystickKnob" class="joystick-knob"></div>
      </div>
    </div>

    <button id="soundButton" class="sound-button" type="button" aria-label="切换声音">🔊</button>
  </main>

  <script src="./src/game.js"></script>
  <script src="./src/phase4a-core.js"></script>
  <script src="./src/phase4a-combat.js"></script>
  <script src="./src/phase4a-loop.js"></script>
  <script src="./src/phase4b-core.js"></script>
  <script src="./src/phase4b-systems.js"></script>
  <script src="./src/phase4b-guns.js"></script>
  <script src="./src/phase4c-balance.js"></script>
  <script src="./src/phase4c-performance.js"></script>
  <script src="./src/phase4c-progression.js"></script>
  <script src="./src/phase4d-audio.js"></script>
  <script src="./src/phase4d-ui.js"></script>
  <script src="./src/phase4d2-art.js"></script>
  <script src="./src/phase4e-scene.js"></script>
  <script src="./src/phase4e-spear-growth.js"></script>
  <script src="./src/phase4e-spear-rifle.js"></script>
  <script src="./src/phase4e1-performance.js"></script>
  <script src="./src/phase4e2-progression.js"></script>
  <script src="./src/phase4e3-cauldron-feedback.js"></script>
</body>
</html>
