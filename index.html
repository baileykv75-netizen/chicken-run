<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#79c86e" />
  <meta name="description" content="《小鸡快跑》——保护鸡群，选择武器，坚持到天亮。" />
  <title>小鸡快跑</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="小鸡快跑游戏画面"></canvas>

    <section id="hud" class="hud hidden" aria-live="polite">
      <div class="hud-top">
        <div class="hud-left">
          <div class="pill">🐥 <span id="chicksAlive">10</span>/10</div>
          <div class="pill">🦊 <span id="foxesDefeated">0</span></div>
          <div class="pill level-pill">⭐ Lv.<span id="level">1</span></div>
          <div class="pill weapon-pill"><span id="weaponIcon">⚔️</span><span id="weaponName">长剑</span></div>
        </div>
        <div id="timer" class="timer">03:00</div>
        <button id="pauseButton" class="icon-button" type="button" aria-label="暂停游戏">Ⅱ</button>
      </div>
      <div class="xp-track" aria-label="经验值">
        <div id="xpBar" class="xp-bar"></div>
      </div>
    </section>

    <section id="startPanel" class="panel start-panel">
      <div class="hero-chick" aria-hidden="true">🐥</div>
      <h1>小鸡快跑</h1>
      <p class="subtitle">选择武器，保护 10 只小鸡，坚持到天亮！</p>

      <div class="weapon-select" id="weaponSelect" aria-label="选择初始武器">
        <button class="weapon-card selected" data-weapon="sword" type="button">
          <span class="weapon-card-icon">⚔️</span>
          <strong>长剑</strong>
          <small>范围均衡，扇形清场</small>
        </button>
        <button class="weapon-card" data-weapon="spear" type="button">
          <span class="weapon-card-icon">🔱</span>
          <strong>长枪</strong>
          <small>投出与召回双路径伤害</small>
        </button>
        <button class="weapon-card" data-weapon="hammer" type="button">
          <span class="weapon-card-icon">🔨</span>
          <strong>大锤</strong>
          <small>攻击缓慢，范围击退与眩晕</small>
        </button>
      </div>

      <div class="instructions">
        <span>电脑：WASD / 方向键移动</span>
        <span>手机：按住画面任意位置生成摇杆</span>
        <span>角色会自动攻击最近的狐狸</span>
      </div>
      <button id="startButton" class="primary-button" type="button">开始守夜</button>
      <p id="bestText" class="best-text">最佳纪录：尚未守夜</p>
    </section>

    <section id="pausePanel" class="panel hidden">
      <h2>已暂停</h2>
      <button id="resumeButton" class="primary-button" type="button">继续游戏</button>
      <button id="restartFromPauseButton" class="secondary-button" type="button">重新开始</button>
    </section>

    <section id="upgradePanel" class="panel upgrade-panel hidden">
      <div class="upgrade-star" aria-hidden="true">⭐</div>
      <h2>升级啦！</h2>
      <p>选择一项强化，本局立即生效</p>
      <div id="upgradeChoices" class="upgrade-choices"></div>
    </section>

    <section id="resultPanel" class="panel hidden">
      <div id="resultEmoji" class="result-emoji" aria-hidden="true">🌅</div>
      <h2 id="resultTitle">天亮了！</h2>
      <p id="resultText"></p>
      <p id="resultBest" class="result-best"></p>
      <button id="restartButton" class="primary-button" type="button">再守一夜</button>
    </section>

    <div id="joystick" class="joystick hidden" aria-hidden="true">
      <div class="joystick-base">
        <div id="joystickKnob" class="joystick-knob"></div>
      </div>
    </div>

    <button id="soundButton" class="sound-button" type="button" aria-label="切换声音">🔊</button>
  </main>

  <script type="module" src="./src/game.js"></script>
</body>
</html>
